name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones previas de la misma rama al llegar un push nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Verificacion de tipos
        working-directory: backend
        run: npm run typecheck

      - name: Pruebas con cobertura
        working-directory: backend
        run: npm run test:cov

      - name: Compilacion
        working-directory: backend
        run: npm run build

      # Falla solo ante vulnerabilidades altas o criticas: las moderadas de
      # dependencias transitivas no deben bloquear la integracion.
      - name: Auditoria de dependencias
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Publicar cobertura del backend
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # El lanzador sin sandbox de karma.conf.js usa el Chrome del runner.
      - name: Pruebas con cobertura
        working-directory: frontend
        run: npm run test:cov

      - name: Compilacion de produccion
        working-directory: frontend
        run: npm run build -- --configuration production

      # No se audita el frontend: Angular 16 esta fuera de soporte y sus CVEs
      # solo se corrigen actualizando de version mayor, lo que el ejercicio
      # prohibe. El analisis del riesgo esta en TECHNICAL_ANALYSIS.md.

      - name: Publicar cobertura del frontend
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/frontend/lcov.info
          retention-days: 1

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud necesita el historico completo para el blame.
          fetch-depth: 0

      - name: Descargar cobertura del backend
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage

      - name: Descargar cobertura del frontend
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/frontend

      - name: Analisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Comprueba que la imagen de produccion compila; no la publica.
      - name: Construir la imagen del backend
        run: docker build -f backend/Dockerfile --target production -t rel-api:ci .

      - name: Construir la imagen del frontend
        run: docker build -f frontend/Dockerfile --target production -t rel-web:ci ./frontend

      # El contenedor de migraciones necesita las devDependencies del backend.
      - name: Construir la imagen de migraciones
        run: docker build -f backend/Dockerfile --target migrator -t rel-migrate:ci .

  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Solo las dependencias de la raiz: Playwright corre contra los
      # contenedores, no contra el codigo fuente.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      - name: Levantar el stack completo
        run: |
          cp .env.example .env
          docker compose --profile full up -d --build

      # El healthcheck se consulta a traves de nginx: valida de paso el proxy.
      - name: Esperar a que la aplicacion responda
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              echo "Aplicacion disponible"
              exit 0
            fi
            sleep 2
          done
          docker compose --profile full logs
          exit 1

      - name: Ejecutar las pruebas
        run: npm run test:e2e

      - name: Publicar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Bajar el stack
        if: always()
        run: docker compose --profile full down -v
