sonar.projectKey=GerardoAmaya_real-estate-lead-management
sonar.organization=gerardoamaya
sonar.projectName=Real Estate Lead Management

# Codigo analizado y pruebas
sonar.sources=backend/src
sonar.tests=backend/src
sonar.test.inclusions=backend/src/**/*.spec.ts
sonar.exclusions=backend/src/**/*.spec.ts,backend/src/test/**,backend/src/**/*.d.ts

# Cobertura generada por Jest
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.typescript.tsconfigPath=backend/tsconfig.json

# El seed y el punto de entrada no aportan a la metrica de cobertura
sonar.coverage.exclusions=backend/src/scripts/**,backend/src/server.ts,backend/src/test/**

sonar.sourceEncoding=UTF-8
