sonar.projectKey=GerardoAmaya_real-estate-lead-management
sonar.organization=gerardoamaya
sonar.projectName=Real Estate Lead Management

# Codigo analizado y pruebas
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=backend/src/**/*.spec.ts,frontend/src/**/*.spec.ts
sonar.exclusions=**/*.spec.ts,backend/src/test/**,**/*.d.ts,frontend/src/environments/**

# Cobertura generada por Jest (backend) y Karma (frontend)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/frontend/lcov.info
sonar.typescript.tsconfigPath=backend/tsconfig.json

# El seed, el punto de entrada y la configuracion no aportan a la cobertura
sonar.coverage.exclusions=backend/src/scripts/**,backend/src/server.ts,backend/src/test/**,frontend/src/main.ts,frontend/src/app/app.config.ts,frontend/src/environments/**

sonar.sourceEncoding=UTF-8
