# Perfiles de uso:
#   docker compose up -d mongo            -> solo la base de datos (desarrollo)
#   docker compose --profile full up      -> stack completo (api + web + mongo)

services:
  mongo:
    image: mongo:7
    container_name: rel-mongo
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    # La API espera a que el healthcheck pase antes de arrancar
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rel-network

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: rel-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Dentro de la red de Docker el host es el nombre del servicio, no localhost
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB_NAME:-real_estate_leads}
      # La ruta de los datos cambia dentro de la imagen
      SEED_DATA_DIR: /app/seed/data
    ports:
      - '3000:3000'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - rel-network

  web:
    profiles: [full]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rel-web
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - api
    networks:
      - rel-network

volumes:
  mongo-data:

networks:
  rel-network:
    driver: bridge
