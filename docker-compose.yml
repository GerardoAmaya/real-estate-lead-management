# Perfiles de uso:
#   docker compose up -d mongo            -> solo la base de datos (desarrollo)
#   docker compose --profile full up      -> stack completo (mongo + migrate + api + web)

services:
  mongo:
    image: mongo:7
    container_name: rel-mongo
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    # La API espera a que el healthcheck pase antes de arrancar
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rel-network

  # Contenedor de un solo disparo: crea indices y validators, carga el Anexo A
  # y termina. La API no arranca hasta que este sale con codigo 0.
  migrate:
    profiles: [full]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    container_name: rel-migrate
    restart: 'no'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB_NAME:-real_estate_leads}
      SEED_DATA_DIR: /app/seed/data
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - rel-network

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: rel-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Dentro de la red de Docker el host es el nombre del servicio, no localhost
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB_NAME:-real_estate_leads}
      # La ruta de los datos cambia dentro de la imagen
      SEED_DATA_DIR: /app/seed/data
      # nginx sirve la SPA y hace proxy de /api: el navegador ve un solo origen
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      mongo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - rel-network

  web:
    profiles: [full]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: rel-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rel-network

volumes:
  mongo-data:

networks:
  rel-network:
    driver: bridge
